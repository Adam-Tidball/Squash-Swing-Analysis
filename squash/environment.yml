# conda env create -f squash/environment.yml && conda activate squash
#
# Python 3.11 and ffmpeg from conda; everything else from pip, so there is
# exactly one OpenCV build (opencv-contrib-python, via mediapipe). conda's
# py-opencv beside it would give two `cv2` packages in one environment.
name: squash
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ffmpeg
  - pip
  - pip:
      - -e .[m0,test]      # the swing command, plus the M0 tools' and tests' needs
